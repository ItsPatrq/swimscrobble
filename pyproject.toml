[project]
name = "swimscrobble"
version = "0.1.0"
description = "Plan offline swim sessions on MP3-mode headphones and scrobble them afterwards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swimscrobble = "swimscrobble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swimscrobble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
