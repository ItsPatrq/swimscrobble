[project]
name = "swimscrobble"
version = "0.1.0"
description = "Plan offline swim sessions on MP3-mode headphones and scrobble them afterwards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "numpy>=1.26",
    "ytmusicapi>=1.8",
    "rich>=13",
    "garminconnect>=0.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swimscrobble = "swimscrobble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swimscrobble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: runs the real ffmpeg (needs it on PATH)"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E701", "E702", "E731", "E741"]
